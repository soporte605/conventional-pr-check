name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear release borrador con el changelog
        id: cl
        uses: ./changelog
        with:
          create-release: true
          draft: true
      - name: Adjuntar la extensión del navegador
        if: steps.cl.outputs.release-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run package:extension
          gh release upload "${{ steps.cl.outputs.next-tag }}" conventional-pr-check-extension.zip --clobber
      - name: Resultado
        run: |
          echo "Bump: ${{ steps.cl.outputs.bump }}"
          echo "Versión: ${{ steps.cl.outputs.next-tag }}"
          echo "Release: ${{ steps.cl.outputs.release-url }}"
