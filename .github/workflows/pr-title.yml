name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar título del PR
        id: pr
        uses: ./
      - name: Mostrar bump
        if: always()
        run: |
          echo "Próximo bump SemVer: ${{ steps.pr.outputs.bump }}"
